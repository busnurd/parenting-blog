<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Parenting Blog</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Clean layout fallbacks */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8fafc;
    }
    header {
      background: #1e293b;
      color: #ffffff;
      padding: 1rem 0;
    }
    nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.5rem;
      align-items: center;
    }
    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: #ffffff;
    }
    main {
      max-width: 900px;
      margin: 2.5rem auto;
      padding: 0 1rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">Parenting Blog</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/blog" class="active">Blog</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/resources">Resources</a></li>
        <li><a href="/subscribe">Subscribe</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Latest Articles</h1>
    <div id="blog-posts">
      <p style="text-align: center; color: #64748b; padding: 2rem;">Loading articles...</p>
    </div>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
