<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Teen Girls Parenting</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --terracotta: #8b3a3a;
      --plum: #4a2c3d;
      --sage: #5b7065;
      --off-white: #faf8f5;
      --card-bg: #ffffff;
      --text-main: #2b2b2b;
      --border-color: #e5dfd8;
      --radius: 8px;
    }
    body { background-color: var(--off-white); color: var(--text-main); font-family: system-ui, sans-serif; line-height: 1.6; margin: 0; }
    header { background: #fff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
    .navbar { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1.5rem; }
    .logo img { height: 40px; }
    .nav-links { display: flex; list-style: none; gap: 1.5rem; }
    .nav-links a { text-decoration: none; color: var(--plum); font-weight: 600; }
    .nav-links a.active { color: var(--terracotta); }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.5rem; }
    .page-title { text-align: center; color: var(--plum); font-size: 2.5rem; margin-bottom: 0.5rem; }
    .page-subtitle { text-align: center; color: var(--sage); margin-bottom: 2.5rem; }

    /* Category Filter Tabs */
    .category-tabs { display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
    .tab-btn { background: #fff; border: 1px solid var(--border-color); color: var(--plum); padding: 0.5rem 1.25rem; border-radius: 20px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
    .tab-btn:hover, .tab-btn.active { background: var(--terracotta); color: #fff; border-color: var(--terracotta); }

    /* Blog Grid Layout */
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
    .post-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1.75rem; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s ease; }
    .post-card:hover { transform: translateY(-3px); }
    .card-category { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--terracotta); font-weight: 700; margin-bottom: 0.5rem; }
    .card-title { font-size: 1.4rem; color: var(--plum); margin-bottom: 0.75rem; line-height: 1.3; }
    .card-title a { color: inherit; text-decoration: none; }
    .card-title a:hover { color: var(--terracotta); }
    .card-snippet { font-size: 0.95rem; color: var(--text-main); margin-bottom: 1.5rem; flex-grow: 1; }
    .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--sage); border-top: 1px solid var(--border-color); padding-top: 1rem; }
    .read-more-btn { color: var(--terracotta); font-weight: 700; text-decoration: none; }

    .no-posts { grid-column: 1 / -1; text-align: center; padding: 3rem; background: #fff; border-radius: var(--radius); border: 1px solid var(--border-color); color: var(--sage); }
    footer { text-align: center; padding: 2rem 1.5rem; border-top: 1px solid var(--border-color); background: #ffffff; color: var(--sage); font-size: 0.9rem; margin-top: 4rem; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo"><a href="/"><img src="/Teen Girls Parenting Logo.webp" alt="Logo"></a></div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/blog" class="active">Blog</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/resources">Resources</a></li>
        <li><a href="/subscribe">Subscribe</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Parenting Insights & Guidance</h1>
    <p class="page-subtitle">Practical advice, honest perspectives, and support for raising teen girls.</p>

    <!-- Category Filter Controls -->
    <div class="category-tabs" id="category-tabs">
      <button class="tab-btn active" data-category="All">All Articles</button>
      <button class="tab-btn" data-category="Parenting">Parenting</button>
      <button class="tab-btn" data-category="Communication">Communication</button>
      <button class="tab-btn" data-category="Growth">Growth</button>
    </div>

    <!-- Dynamic Posts Container -->
    <div class="blog-grid" id="posts-container">
      <div class="no-posts">Loading articles...</div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Teen Girls Parenting. All rights reserved.</p>
  </footer>

  <script>
    let allPosts = [];

    // Safely retrieve the post link target
    function getPostUrl(post) {
      if (post.slug && post.slug !== 'undefined') return '/blog/' + post.slug;
      if (post.id && post.id !== 'undefined') return '/blog/' + post.id;
      return '/blog/1';
    }

    // Escape HTML to prevent XSS issues
    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // Render post cards inside grid
    function renderPosts(postsToRender) {
      const container = document.getElementById('posts-container');
      
      if (!postsToRender || postsToRender.length === 0) {
        container.innerHTML = '<div class="no-posts">No articles found in this category.</div>';
        return;
      }

      container.innerHTML = postsToRender.map(post => {
        const articleUrl = getPostUrl(post);
        const category = post.category || 'Parenting';
        const dateStr = post.created_at ? new Date(post.created_at).toLocaleDateString() : 'Recent';
        const snippet = post.content ? post.content.substring(0, 120) + '...' : '';

        return `
          <article class="post-card">
            <div>
              <div class="card-category">${escapeHTML(category)}</div>
              <h2 class="card-title">
                <a href="${articleUrl}">${escapeHTML(post.title)}</a>
              </h2>
              <p class="card-snippet">${escapeHTML(snippet)}</p>
            </div>
            <div class="card-meta">
              <span>${dateStr}</span>
              <a href="${articleUrl}" class="read-more-btn">Read More →</a>
            </div>
          </article>
        `;
      }).join('');
    }

    // Fetch posts from API on load
    document.addEventListener('DOMContentLoaded', () => {
      fetch('/api/posts')
        .then(res => res.json())
        .then(posts => {
          allPosts = posts || [];
          renderPosts(allPosts);
        })
        .catch(err => {
          console.error('Error fetching blog posts:', err);
          document.getElementById('posts-container').innerHTML = 
            '<div class="no-posts">Unable to load articles. Please refresh the page.</div>';
        });

      // Handle Category Tab clicks
      document.getElementById('category-tabs').addEventListener('click', (e) => {
        if (!e.target.classList.contains('tab-btn')) return;

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');

        const selectedCategory = e.target.getAttribute('data-category');
        if (selectedCategory === 'All') {
          renderPosts(allPosts);
        } else {
          const filtered = allPosts.filter(p => (p.category || 'Parenting').toLowerCase() === selectedCategory.toLowerCase());
          renderPosts(filtered);
        }
      });
    });
  </script>
</body>
  </html>
