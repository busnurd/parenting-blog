<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Parenting Blog</title>
  
  <!-- Serves your exact CSS file regardless of subfolder path -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="/" class="logo">Parenting Blog</a>
      
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-menu" id="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/blog">Blog</a></li>
        <li><a href="/resources">Resources</a></li>
        <li><a href="/subscribe">Subscribe</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Latest Blog Posts</h1>
    <div id="posts-container">
      <p class="loading-text">Loading posts...</p>
    </div>
  </main>

  <!-- Connects to your existing main.js script -->
  <script src="/js/main.js"></script>
  <script src="/main.js"></script>

  <!-- Database Article Fetcher -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('posts-container');

      if (container) {
        fetch('/api/posts')
          .then(res => res.json())
          .then(posts => {
            if (!posts || posts.length === 0) {
              container.innerHTML = '<p>No posts available yet.</p>';
              return;
            }

            container.innerHTML = posts.map(post => `
              <article class="post-card">
                <h2>${post.title}</h2>
                <p>${post.content}</p>
                <span class="meta">Published: ${new Date(post.created_at).toLocaleDateString()}</span>
              </article>
            `).join('');
          })
          .catch(err => {
            console.error('Fetch error:', err);
            container.innerHTML = '<p style="color: red;">Failed to load blog posts. Please refresh.</p>';
          });
      }
    });
  </script>
</body>
</html>
