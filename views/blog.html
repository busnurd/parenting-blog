<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Teen Girls Parenting — Insights & Articles</title>
  <meta name="description" content="Read articles on parenting teenage girls, understanding adolescent mental health, screen time boundaries, and building strong family connections.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Mobile Navigation & Hamburger Menu Styles */
    .navbar {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 26px;
      height: 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 2010;
    }

    .hamburger span {
      width: 100%;
      height: 3px;
      background-color: var(--plum, #4a2c3d);
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .hamburger {
        display: flex;
      }

      .hamburger.active span:nth-child(1) {
        transform: translateY(8px) rotate(45deg);
      }

      .hamburger.active span:nth-child(2) {
        opacity: 0;
      }

      .hamburger.active span:nth-child(3) {
        transform: translateY(-9px) rotate(-45deg);
      }

      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: #ffffff;
        padding: 1rem 0;
        border-bottom: 2px solid var(--border-color, #e5dfd8);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        z-index: 2000;
      }

      .nav-links.active {
        display: flex !important;
      }

      .nav-links li {
        text-align: center;
        width: 100%;
      }

      .nav-links li a {
        width: 100%;
        display: block;
        padding: 0.85rem 0;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="/">
          <img src="/Teen Girls Parenting Logo.webp" alt="Parenting Blog Logo">
        </a>
      </div>

      <button class="hamburger" id="hamburger-btn" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/blog" class="active">Blog</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/resources">Resources</a></li>
        <li><a href="/subscribe">Subscribe</a></li>
      </ul>
    </nav>
  </header>

  <main class="blog-page container">
    <section class="blog-hero">
      <h1>Articles & Guidance</h1>
      <p>Research-backed strategies, communication advice, and actionable parenting insights.</p>
    </section>

    <section class="articles-grid" id="articles-grid">
      <p style="color: var(--sage, #5b7065);">Loading articles...</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Teen Girls Parenting. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mobile Drawer Toggle
      const btn = document.getElementById('hamburger-btn');
      const menu = document.getElementById('nav-links');

      if (btn && menu) {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          btn.classList.toggle('active');
          menu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
          if (!btn.contains(e.target) && !menu.contains(e.target)) {
            btn.classList.remove('active');
            menu.classList.remove('active');
          }
        });

        const links = menu.querySelectorAll('a');
        links.forEach(link => {
          link.addEventListener('click', () => {
            btn.classList.remove('active');
            menu.classList.remove('active');
          });
        });
      }

      // Fetch dynamic posts from API
      const grid = document.getElementById('articles-grid');
      if (grid) {
        fetch('/api/posts')
          .then(res => res.json())
          .then(posts => {
            if (!posts || posts.length === 0) {
              grid.innerHTML = '<p style="color: var(--sage, #5b7065);">No published articles found.</p>';
              return;
            }
            grid.innerHTML = posts.map(post => `
              <article class="post-card card">
                <h2><a href="/blog/${post.id}">${escapeHTML(post.title)}</a></h2>
                <p>${escapeHTML(post.content ? post.content.substring(0, 150) + '...' : '')}</p>
                <span class="meta">${new Date(post.created_at).toLocaleDateString()}</span>
              </article>
            `).join('');
          })
          .catch(() => {
            grid.innerHTML = '<p style="color: var(--sage, #5b7065);">Unable to load articles right now.</p>';
          });
      }
    });

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
